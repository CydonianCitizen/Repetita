name: Bug Report
description: Report a defect or unexpected behavior in Repetita
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please verify you are using the latest version of Repetita.
  - type: input
    id: version
    attributes:
      label: Repetita Version
      description: What version of Repetita are you running? (e.g., 0.5.6)
      placeholder: "0.5.6"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: Which operating system or device are you using?
      options:
        - Android
        - iOS
        - Other / Emulator
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste any terminal output, Flutter logs, or screenshots if available.
      render: shell
